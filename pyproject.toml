[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdea-videoqa"
version = "0.1.0"
description = "Hypothesis-Discriminative Evidence Acquisition for long-video multiple-choice QA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
retrieval = [
  "torch>=2.1",
  "transformers>=4.37",
  "pillow>=10.0",
]
analysis = [
  "pandas>=2.0",
  "scipy>=1.10",
  "pyarrow>=10",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

